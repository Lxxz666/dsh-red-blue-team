<text x="420" y="462" fill="#e6e9f0" font-size="12" font-family="monospace">理论 3.4657s · 实测 3.4657s（误差 <1e-4）✓</text>
<text x="40" y="502" fill="#7a5cff" font-size="12" font-family="monospace">① 势能地形</text>
<text x="230" y="502" fill="#e6e9f0" font-size="12" font-family="monospace">Φ = Φ_goal + Φ_base + Φ_trace + Φ_erosion</text>
<text x="40" y="528" fill="#7a5cff" font-size="12" font-family="monospace">② 水迹沉积/蒸发</text>
<text x="230" y="528" fill="#e6e9f0" font-size="12" font-family="monospace">∂T/∂t = βρ − λT（旧路径更低 → 新水流优先沿旧径）</text>
<text x="40" y="554" fill="#7a5cff" font-size="12" font-family="monospace">③ Langevin 流动</text>
<text x="230" y="554" fill="#e6e9f0" font-size="12" font-family="monospace">dx = −∇Φ dt + √(2D) dW（软最小 Boltzmann 选向）</text>
<text x="40" y="580" fill="#7a5cff" font-size="12" font-family="monospace">④ 洼地侵蚀</text>
<text x="230" y="580" fill="#e6e9f0" font-size="12" font-family="monospace">停滞检测 → 目标方向偏置开挖 + 退火（逃出局部最优）</text>
