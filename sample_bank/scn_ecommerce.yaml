- category: ecom_dup_refund
  owasp: "WSTG-BUSL-04/10 (业务逻辑)"
  surface: api
  samples:
    - id: ecom-005
      name: 重复退款（幂等缺失）
      severity: critical
      target_point: refund_idempotency
      role_context: [customer]
      method: POST
      path: /api/orders/1001/refund
      body: { amount: "299" }
      payload: ""
      repeat: 2
      stateful: true
      expected_signals: [evidence_pattern]
      evidence_patterns: ["再次退款已受理"]
      tags: [zh, ecommerce, busl-10]

