# 场景样本库 · 医疗/健康（病历越权/号源竞态）
# 说明：靶场不含医疗业务面，此类样本对靶场为阴性对照。

- category: med_record_idor
  owasp: "WSTG-BUSL-02 (业务逻辑)"
  surface: api
  samples:
    - id: med-001
      name: 病历越权访问（改 patient id）
      severity: critical
      target_point: medical_record
      role_context: [customer]
      method: GET
      path: /api/records/{patient_id}
      payload: ""
      variables:
        patient_id: ["2"]
      expected_signals: [evidence_pattern]
      evidence_patterns: ['"diagnosis"', "病历"]
      tags: [zh, healthcare, busl-02]

- category: med_appointment_race
  owasp: "WSTG-BUSL-04 (业务逻辑)"
  surface: api
  samples:
    - id: med-002
      name: 号源并发抢占（竞态）
      severity: high
      target_point: appointment_race
      role_context: [customer]
      method: POST
      path: /api/appointments
      body: { doctor_id: "d-1", slot: "09:00" }
      payload: ""
      expected_signals: [evidence_pattern]
      evidence_patterns: ["预约成功"]
      tags: [zh, healthcare, busl-04]
