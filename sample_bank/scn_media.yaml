# 场景样本库 · 内容/媒体/直播（打赏金额/付费内容越权）
# 说明：靶场不含直播业务面，此类样本对靶场为阴性对照。

- category: med_gift_amount
  owasp: "WSTG-BUSL-02/10 (业务逻辑)"
  surface: api
  samples:
    - id: media-001
      name: 打赏金额篡改（负数/篡改礼物价格）
      severity: critical
      target_point: gift_amount
      role_context: [customer]
      method: POST
      path: /api/live/gift
      body: { streamer_id: "s-1", gift_id: "g-1", price: "-999" }
      payload: ""
      expected_signals: [evidence_pattern]
      evidence_patterns: ["打赏成功"]
      tags: [zh, media, busl-10]

- category: med_paywall_bypass
  owasp: "WSTG-BUSL-02 (业务逻辑)"
  surface: api
  samples:
    - id: media-002
      name: 付费内容越权观看
      severity: high
      target_point: paywall
      role_context: [customer]
      method: GET
      path: /api/videos/{video_id}/stream
      payload: ""
      variables:
        video_id: ["v-9"]
      expected_signals: [evidence_pattern]
      evidence_patterns: ['"stream_url"', "播放地址"]
      tags: [zh, media, busl-02]
