# 场景样本库 · 外卖/物流/出行（配送费篡改/送达确认绕过）
# 说明：靶场不含外卖业务面，此类样本对靶场为阴性对照。

- category: dlv_fee_tamper
  owasp: "WSTG-BUSL-02 (业务逻辑)"
  surface: api
  samples:
    - id: dlv-001
      name: 配送费/打包费篡改（客户端改费用）
      severity: critical
      target_point: delivery_fee
      role_context: [customer]
      method: POST
      path: /api/orders/quote
      body: { distance_km: "0.1", fee: "0" }
      payload: ""
      expected_signals: [evidence_pattern]
      evidence_patterns: ["运费已更新", "fee.*accepted"]
      tags: [zh, delivery, busl-02]

- category: dlv_confirm_bypass
  owasp: "WSTG-BUSL-06 (业务逻辑)"
  surface: api
  samples:
    - id: dlv-002
      name: 送达确认绕过（未送达点确认）
      severity: high
      target_point: delivery_confirm
      role_context: [customer]
      method: POST
      path: /api/orders/confirm
      body: { order_id: "1" }
      payload: ""
      expected_signals: [evidence_pattern]
      evidence_patterns: ["确认成功"]
      tags: [zh, delivery, busl-06]
