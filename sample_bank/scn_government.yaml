# 场景样本库 · 政务/公共服务（办事流程跳步/个人信息越权）
# 说明：靶场不含政务业务面，此类样本对靶场为阴性对照。

- category: gov_workflow_jump
  owasp: "WSTG-BUSL-06 (业务逻辑)"
  surface: api
  samples:
    - id: gov-001
      name: 办事流程跳步（未提交材料直接办结）
      severity: critical
      target_point: workflow_bypass
      role_context: [customer]
      method: POST
      path: /api/cases/{case_id}/finish
      payload: ""
      variables:
        case_id: ["1"]
      expected_signals: [evidence_pattern]
      evidence_patterns: ["已办结", "finished"]
      tags: [zh, government, busl-06]

- category: gov_data_idor
  owasp: "WSTG-BUSL-02 (业务逻辑)"
  surface: api
  samples:
    - id: gov-002
      name: 个人信息越权查询（户籍/社保）
      severity: critical
      target_point: citizen_data
      role_context: [customer]
      method: GET
      path: /api/citizens/{citizen_id}
      payload: ""
      variables:
        citizen_id: ["2"]
      expected_signals: [evidence_pattern]
